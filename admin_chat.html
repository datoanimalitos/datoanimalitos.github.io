<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Admin TuChat - Dr.Animalitos</title>
    <link rel="icon" href="./favicon.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Firebase SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase-app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase-firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
                "firebase-messaging": "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js"
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 10px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #0f0f1a;
            border-radius: 28px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #0d0d1a 0%, #1a0d2a 50%, #0d1a2a 100%);
            padding: 16px 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h2 {
            color: #ffd700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .badge {
            background: #ff4444;
            color: white;
            border-radius: 50%;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: 700;
            display: none;
        }

        .header .badge.show {
            display: inline-block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .header .status {
            font-size: 0.65rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .header .status .dot.online {
            background: #4caf50;
        }

        .header .status .dot.offline {
            background: #ff6b6b;
        }

        .login-panel {
            padding: 40px 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .login-panel .logo {
            font-size: 3.5rem;
            margin-bottom: 5px;
        }

        .login-panel h3 {
            color: #ffd700;
            font-size: 1.4rem;
        }

        .login-panel p {
            color: #94a3b8;
            font-size: 0.9rem;
            max-width: 280px;
        }

        .login-panel input {
            padding: 14px 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            background: #151226;
            color: #fff;
            width: 90%;
            max-width: 320px;
            text-align: center;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .login-panel input:focus {
            border-color: #ffd700;
        }

        .login-panel button {
            background: linear-gradient(135deg, #ffd700, #d4af37);
            color: #0a0a0f;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 90%;
            max-width: 320px;
        }

        .login-panel button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 25px rgba(255, 215, 0, 0.3);
        }

        .login-panel button:active {
            transform: scale(0.98);
        }

        .login-panel .error {
            color: #ff6b6b;
            font-size: 0.85rem;
            min-height: 20px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0a0a12;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .no-mensajes {
            text-align: center;
            color: #718096;
            padding: 40px 20px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .no-mensajes i {
            font-size: 2.5rem;
            color: #ffd700;
            opacity: 0.3;
        }

        .mensaje {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 16px;
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            word-wrap: break-word;
            align-self: flex-start;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mensaje.usuario {
            border-left: 3px solid #4a9eff;
            background: #0d1a2a;
        }

        .mensaje.admin {
            align-self: flex-end;
            border-right: 3px solid #ffd700;
            background: #1a1a0d;
        }

        .mensaje .usuario-nombre {
            font-weight: 700;
            font-size: 0.7rem;
            color: #ffd700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mensaje .usuario-nombre .admin-badge {
            background: #ffd700;
            color: #0a0a0f;
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .mensaje .texto {
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .mensaje .hora {
            font-size: 0.55rem;
            color: #718096;
            margin-top: 4px;
            text-align: right;
        }

        .mensaje .responder-btn {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.6rem;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
            font-weight: 600;
        }

        .mensaje .responder-btn:hover {
            background: rgba(255, 215, 0, 0.25);
        }

        .mensaje .responder-btn:active {
            transform: scale(0.95);
        }

        .footer {
            padding: 10px 14px;
            background: #0f0f1a;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #0a0a12;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            padding: 2px 4px;
            transition: border 0.3s;
            min-width: 120px;
        }

        .footer .input-wrapper:focus-within {
            border-color: #ffd700;
        }

        .footer .input-wrapper input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 30px;
            background: transparent;
            color: #e2e8f0;
            font-size: 0.9rem;
            outline: none;
            min-width: 50px;
        }

        .footer .input-wrapper input::placeholder {
            color: #555;
        }

        .footer button {
            background: linear-gradient(135deg, #ffd700, #d4af37);
            color: #0a0a0f;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }

        .footer button:active {
            transform: scale(0.95);
        }

        .footer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer .respondiendo-a {
            font-size: 0.6rem;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: none;
            white-space: nowrap;
        }

        .footer .respondiendo-a.show {
            display: inline-block;
        }

        .hidden {
            display: none !important;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid #ffd700;
            border-radius: 16px;
            padding: 12px 20px;
            color: #fff;
            z-index: 9999;
            display: none;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .toast.show {
            display: block;
        }

        .toast .toast-title {
            font-weight: 700;
            color: #ffd700;
            font-size: 0.85rem;
        }

        .toast .toast-body {
            font-size: 0.8rem;
            color: #e2e8f0;
            margin-top: 2px;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 20px;
                height: 98vh;
                max-height: none;
            }
            .header h2 {
                font-size: 0.95rem;
            }
            .login-panel h3 {
                font-size: 1.2rem;
            }
            .login-panel input,
            .login-panel button {
                width: 100%;
            }
            .footer button {
                padding: 10px 14px;
                font-size: 0.8rem;
            }
            .footer .input-wrapper input {
                font-size: 0.85rem;
                padding: 8px 12px;
            }
            .mensaje {
                max-width: 92%;
                padding: 8px 12px;
            }
            .mensaje .texto {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 380px) {
            .header h2 {
                font-size: 0.8rem;
            }
            .header .status {
                font-size: 0.55rem;
            }
            .footer button {
                padding: 8px 10px;
                font-size: 0.7rem;
            }
            .footer .input-wrapper input {
                font-size: 0.75rem;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">
        <div class="toast-title" id="toastTitle">🔔 Nuevo mensaje</div>
        <div class="toast-body" id="toastBody">Mensaje de usuario</div>
    </div>

    <div class="container" id="app">
        
        <div class="header">
            <h2><i class="bi bi-chat-fill"></i> Admin TuChat</h2>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="badge" id="unreadBadge">0</span>
                <div class="status">
                    <span class="dot online" id="statusDot"></span>
                    <span id="statusText">Conectado</span>
                </div>
            </div>
        </div>

        <div class="login-panel" id="loginPanel">
            <div class="logo">🐾</div>
            <h3>👑 Acceso Administrador</h3>
            <p>Ingresa tu clave para gestionar las consultas de la comunidad</p>
            <input type="password" id="adminClave" placeholder="Clave de administrador..." autocomplete="off">
            <button id="btnLoginAdmin"><i class="bi bi-unlock-fill"></i> Acceder</button>
            <div class="error" id="loginError"></div>
        </div>

        <div class="chat-container hidden" id="chatContainer">
            <div class="no-mensajes" id="noMensajes">
                <i class="bi bi-chat-dots"></i>
                <span>No hay mensajes aún</span>
                <span style="font-size:0.8rem; color:#555;">Los usuarios se comunicarán aquí</span>
            </div>
        </div>

        <div class="footer hidden" id="footerInput">
            <div class="input-wrapper">
                <input type="text" id="mensajeInput" placeholder="Escribe tu respuesta..." disabled>
            </div>
            <span class="respondiendo-a" id="respondiendoA">Respondiendo a: <span id="nombreDestino"></span></span>
            <button id="btnEnviar" disabled><i class="bi bi-send-fill"></i> Enviar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot, addDoc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVx1XqO0HOOrgT6CIV5JJ4NujwGx2iZS4",
            authDomain: "dato-animalitos.firebaseapp.com",
            projectId: "dato-animalitos",
            storageBucket: "dato-animalitos.firebasestorage.app",
            messagingSenderId: "759403364736",
            appId: "1:759403364736:web:c686aea85758245a7f4165"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_CLAVE = "admin14055604";
        let adminAutenticado = false;
        let ultimoRemitente = '';
        let mensajesCargados = false;
        let unreadCount = 0;

        const loginPanel = document.getElementById('loginPanel');
        const chatContainer = document.getElementById('chatContainer');
        const footerInput = document.getElementById('footerInput');
        const adminClave = document.getElementById('adminClave');
        const btnLoginAdmin = document.getElementById('btnLoginAdmin');
        const loginError = document.getElementById('loginError');
        const mensajeInput = document.getElementById('mensajeInput');
        const btnEnviar = document.getElementById('btnEnviar');
        const unreadBadge = document.getElementById('unreadBadge');
        const noMensajes = document.getElementById('noMensajes');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const respondiendoA = document.getElementById('respondiendoA');
        const nombreDestino = document.getElementById('nombreDestino');
        const toast = document.getElementById('toast');
        const toastTitle = document.getElementById('toastTitle');
        const toastBody = document.getElementById('toastBody');

        btnLoginAdmin.addEventListener('click', autenticarAdmin);
        adminClave.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') autenticarAdmin();
        });

        function autenticarAdmin() {
            const clave = adminClave.value.trim();
            if (clave === ADMIN_CLAVE) {
                adminAutenticado = true;
                loginPanel.classList.add('hidden');
                chatContainer.classList.remove('hidden');
                footerInput.classList.remove('hidden');
                mensajeInput.disabled = false;
                btnEnviar.disabled = false;
                loginError.textContent = '';
                cargarMensajesAdmin();
                solicitarPermisos();
                iniciarNotificaciones();
                statusDot.className = 'dot online';
                statusText.textContent = 'Admin';
            } else {
                loginError.textContent = '❌ Clave incorrecta';
                setTimeout(() => loginError.textContent = '', 3000);
            }
        }

        async function solicitarPermisos() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        async function iniciarNotificaciones() {
            try {
                const messaging = getMessaging(app);
                const vapidKey = 'BLLNJg7id5b0bVIf5TdWb0VIf5TdWb0VIf5TdWb0VIf5TdWb0VIf5TdWb0';
                const token = await getToken(messaging, { vapidKey: vapidKey });
                console.log('✅ Token FCM:', token);
                onMessage(messaging, (payload) => {
                    console.log('📩 Notificación:', payload);
                    mostrarToast(payload.notification.title, payload.notification.body);
                    unreadCount++;
                    unreadBadge.textContent = unreadCount;
                    unreadBadge.classList.add('show');
                });
            } catch (error) {
                console.warn('⚠️ FCM no disponible:', error);
            }
        }

        function mostrarToast(title, body) {
            toastTitle.textContent = title || '🔔 Nuevo mensaje';
            toastBody.textContent = body || 'Alguien escribió en el chat';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 5000);
        }

        btnEnviar.addEventListener('click', enviarRespuesta);
        mensajeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarRespuesta();
        });

        async function enviarRespuesta() {
            const texto = mensajeInput.value.trim();
            if (!texto) return;
            const destino = ultimoRemitente || 'Usuario';
            try {
                await addDoc(collection(db, "tuchat_mensajes"), {
                    usuario: 'Dr.Animalitos',
                    texto: texto,
                    timestamp: serverTimestamp(),
                    esAdmin: true,
                    tipo: 'texto',
                    respuestaA: destino
                });
                mensajeInput.value = '';
                mensajeInput.focus();
                respondiendoA.classList.remove('show');
            } catch (error) {
                console.error('❌ Error al enviar:', error);
                mostrarToast('❌ Error', 'No se pudo enviar la respuesta');
            }
        }

        function cargarMensajesAdmin() {
            if (mensajesCargados) return;
            mensajesCargados = true;

            const q = query(collection(db, "tuchat_mensajes"), orderBy("timestamp", "asc"));

            onSnapshot(q, (snapshot) => {
                const mensajesExistentes = chatContainer.querySelectorAll('.mensaje');
                if (mensajesExistentes.length > 0 && snapshot.docChanges().length > 0) {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            const data = change.doc.data();
                            agregarMensaje(data, change.doc.id);
                        }
                    });
                } else if (mensajesExistentes.length === 0) {
                    chatContainer.innerHTML = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        agregarMensaje(data, doc.id);
                    });
                }
                noMensajes.style.display = 'none';
                actualizarBadge();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, (error) => {
                console.error('❌ Error al cargar mensajes:', error);
                chatContainer.innerHTML = `
                    <div class="no-mensajes">
                        <i class="bi bi-exclamation-triangle-fill" style="color:#ff6b6b;"></i>
                        <span>Error al cargar mensajes</span>
                        <span style="font-size:0.8rem; color:#555;">${error.message}</span>
                    </div>
                `;
            });
        }

        function agregarMensaje(data, docId) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'mensaje';
            msgDiv.dataset.id = docId;

            if (data.esAdmin) {
                msgDiv.classList.add('admin');
            } else {
                msgDiv.classList.add('usuario');
                ultimoRemitente = data.usuario;
            }

            const userSpan = document.createElement('div');
            userSpan.className = 'usuario-nombre';
            if (data.esAdmin) {
                userSpan.innerHTML = `👑 Dr.Animalitos <span class="admin-badge">ADMIN</span>`;
            } else {
                userSpan.innerHTML = `🐾 ${data.usuario}`;
                const btnResponder = document.createElement('button');
                btnResponder.className = 'responder-btn';
                btnResponder.innerHTML = '<i class="bi bi-reply-fill"></i> Responder';
                btnResponder.addEventListener('click', () => {
                    mensajeInput.value = `@${data.usuario} `;
                    mensajeInput.focus();
                    nombreDestino.textContent = data.usuario;
                    respondiendoA.classList.add('show');
                });
                userSpan.appendChild(btnResponder);
            }

            const textSpan = document.createElement('div');
            textSpan.className = 'texto';
            textSpan.textContent = data.texto;

            const timeSpan = document.createElement('div');
            timeSpan.className = 'hora';
            if (data.timestamp) {
                const date = data.timestamp.toDate();
                timeSpan.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            msgDiv.appendChild(userSpan);
            msgDiv.appendChild(textSpan);
            msgDiv.appendChild(timeSpan);
            chatContainer.appendChild(msgDiv);

            if (!data.esAdmin && data.usuario !== 'Dr.Animalitos') {
                unreadCount++;
            }
        }

        function actualizarBadge() {
            if (unreadCount > 0) {
                unreadBadge.textContent = unreadCount;
                unreadBadge.classList.add('show');
            } else {
                unreadBadge.classList.remove('show');
            }
        }

        window.enviarComoAdmin = async function(texto) {
            if (!texto || texto.trim() === '') return;
            try {
                await addDoc(collection(db, "tuchat_mensajes"), {
                    usuario: 'Dr.Animalitos',
                    texto: texto.trim(),
                    timestamp: serverTimestamp(),
                    esAdmin: true,
                    tipo: 'texto'
                });
                console.log('✅ Mensaje de admin enviado');
            } catch (error) {
                console.error('❌ Error:', error);
            }
        };

        console.log('👑 Panel Admin de TuChat cargado');
        console.log('📌 Clave de admin:', ADMIN_CLAVE);
        console.log('💬 Para enviar mensaje desde consola: enviarComoAdmin("Texto")');
    </script>
</body>
</html>
