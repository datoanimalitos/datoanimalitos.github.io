<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 98%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <form id="form-login">
            <input type="text" placeholder="Usuario" required><br>
            <input type="password" placeholder="Contraseña" required><br>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <!-- Cargar la función desde el archivo JS -->
    <script src="js/contador.js"></script>

    <script>
        document.getElementById("form-login").addEventListener("submit", function(event) {
            // Evitar el envío automático del formulario
            event.preventDefault();

            // Validar el límite diario
            const accesoPermitido = verificarAccesoDiario();

            if (accesoPermitido) {
                // Si aún le quedan ingresos, lo rediriges a tu página principal
                // Cambia 'animalitos/index.html' por la ruta de tu sección protegida
                window.location.href = "animalitos/index.html"; 
            }
            // Si el acceso fue denegado (false), se muestra el alert() indicando que agotó sus accesos y se detiene la acción.
        });
    </script>

</body>
</html>
